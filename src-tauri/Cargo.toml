[package]
name = "music-tools"
version = "2.0.0"
description = "Music Tools"
authors = ["FaunaTools"]
edition = "2021"
rust-version = "1.77"
default-run = "music-tools"

# Имя бинарника — исходное music-tools.exe. Переименование в «Music Tools.exe»
# выполняется на шаге бандла (productName в tauri.conf.json), т.к. cargo не
# принимает пробелы в имени пакета.
[[bin]]
name = "music-tools"
path = "src/main.rs"

[lib]
name = "music_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["sync", "time", "process", "macros", "io-util", "rt"] }

# Обновления: GitHub API, Ed25519-подпись манифеста, SHA-256 файла.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
futures-util = "0.3"

# Плагины подключаются вместе с первыми командами, которым они нужны,
# чтобы capabilities оставались минимальными (см. docs/TAURI_ARCHITECTURE.md).
# tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
